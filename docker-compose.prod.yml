services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hms_backend
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: hms_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
