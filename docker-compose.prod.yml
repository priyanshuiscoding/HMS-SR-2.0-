x-backend-common: &backend-common
  image: sr-aiims-hms-backend:latest
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file:
    - ${HMS_ENV_FILE:-.env.production.server}
  security_opt:
    - no-new-privileges:true

services:
  migrate:
    <<: *backend-common
    container_name: hms_migrate
    restart: "no"
    command: ["npm", "--workspace", "backend", "run", "db:migrate"]

  backend:
    <<: *backend-common
    container_name: hms_backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "5000"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: hms_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:5173:80"
